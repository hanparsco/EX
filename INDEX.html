<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excipients</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #6699cc;
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .header .divider {
            width: 100px;
            height: 2px;
            background-color: #cccccc;
            margin: 0 auto;
        }
        
        .content-title {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .content-title h2 {
            color: #333333;
            font-size: 28px;
        }
        
        .search-container {
            margin-bottom: 20px;
        }
        
        #searchInput {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        .table-container {
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background-color: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #ddd;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        
        tr:hover {
            background-color: #f9f9f9;
        }
        
        .excipient-name {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }
        
        .excipient-name:hover {
            text-decoration: underline;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        .pagination button {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            color: #333;
            padding: 8px 16px;
            text-decoration: none;
            margin: 0 4px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .pagination button.active {
            background-color: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
        }
        
        .pagination button:hover:not(.active) {
            background-color: #ddd;
        }
        
        .footer {
            background-color: #87CEFA;
            padding: 40px 0;
            text-align: center;
            margin-top: 60px;
        }
        
        .footer-button {
            display: inline-block;
            background-color: #1a1a2e;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .inquiry-section {
            text-align: center;
            margin-top: 60px;
        }
        
        .inquiry-section h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }
        
        .inquiry-section p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .contact-button {
            display: inline-block;
            background-color: #87CEFA;
            color: #333;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EXCIPIENTS LIST</h1>
            <div class="divider"></div>
        </div>
        
        <div class="content-title">
            <h2>Pharmaceutical Excipients</h2>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for excipients...">
        </div>
        
        <div class="table-container">
            <table id="excipientsTable">
                <thead>
                    <tr>
                        <th>Excipient Name</th>
                        <th>Route</th>
                        <th>Dosage Form</th>
                        <th>CAS Number</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Table content will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
        
        <div class="pagination" id="pagination">
            <!-- Pagination buttons will be added by JavaScript -->
        </div>
    </div>
    
    <div class="inquiry-section">
        <h2>DO YOU HAVE ANY INQUIRY?</h2>
        <p>Just let us know if you need any COA or Price quote:</p>
        <a href="#" class="contact-button">CONTACT US</a>
    </div>
    
    <script src="excipients_data.js"></script>
    <script>
        // Pagination variables
        let currentPage = 1;
        const rowsPerPage = 20;
        let searchActive = false;
        let filteredData = [];
        
        // Function to display data with pagination
        function displayExcipientData(page, filteredData = null) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            const data = filteredData || excipientData;
            const startIndex = (page - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, data.length);
            
            for (let i = startIndex; i < endIndex; i++) {
                const row = document.createElement('tr');
                
                const nameCell = document.createElement('td');
                const nameLink = document.createElement('a');
                nameLink.textContent = data[i][0];
                nameLink.href = '#';
                nameLink.className = 'excipient-name';
                nameCell.appendChild(nameLink);
                row.appendChild(nameCell);
                
                for (let j = 1; j < 4; j++) {
                    const cell = document.createElement('td');
                    cell.textContent = data[i][j];
                    row.appendChild(cell);
                }
                
                tableBody.appendChild(row);
            }
            
            updatePagination(page, data.length);
        }
        
        // Function to update pagination buttons
        function updatePagination(currentPage, totalItems) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            const totalPages = Math.ceil(totalItems / rowsPerPage);
            
            // Previous button
            const prevButton = document.createElement('button');
            prevButton.textContent = 'Previous';
            prevButton.disabled = currentPage === 1;
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    displayExcipientData(currentPage, searchActive ? filteredData : null);
                }
            });
            pagination.appendChild(prevButton);
            
            // Page buttons
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                if (i === currentPage) {
                    pageButton.className = 'active';
                }
                pageButton.addEventListener('click', () => {
                    currentPage = i;
                    displayExcipientData(currentPage, searchActive ? filteredData : null);
                });
                pagination.appendChild(pageButton);
            }
            
            // Next button
            const nextButton = document.createElement('button');
            nextButton.textContent = 'Next';
            nextButton.disabled = currentPage === totalPages;
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    displayExcipientData(currentPage, searchActive ? filteredData : null);
                }
            });
            pagination.appendChild(nextButton);
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm.length > 0) {
                searchActive = true;
                filteredData = excipientData.filter(item => {
                    return item.some(field => field.toLowerCase().includes(searchTerm));
                });
                currentPage = 1;
                displayExcipientData(currentPage, filteredData);
            } else {
                searchActive = false;
                currentPage = 1;
                displayExcipientData(currentPage);
            }
        });
        
        // Initialize the table
        document.addEventListener('DOMContentLoaded', function() {
            // Display the first page
            displayExcipientData(currentPage);
        });
    </script>
</body>
</html>
